name: Update Homebrew Formulas

on:
  schedule:
    - cron: '0 20 * * *'  # 每天执行一次 北京时间 4:00
  workflow_dispatch:     # 手动触发

jobs:
  update-formulas:
    # 仅允许 main 分支执行，其他分支或标签的手动触发直接跳过。
    if: ${{ github.ref == 'refs/heads/main' }}
    runs-on: macos-15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Homebrew
        id: setup-homebrew
        uses: Homebrew/actions/setup-homebrew@main

      - name: Configure git user
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Update Homebrew
        run: brew update

      - name: Install jq
        run: brew install jq

      - name: Check and update casks
        id: update-casks
        env:
          TAP_NAME: ${{ steps.setup-homebrew.outputs.tap-name }}
          HOMEBREW_GITHUB_API_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HOMEBREW_DEVELOPER: "1"
        run: ./scripts/update-casks.sh

      - name: Push changes
        # 部分 cask 失败时仍推送其他已完成的更新，作业保留失败状态；取消时不推送。
        if: ${{ !cancelled() && (steps.update-casks.outcome == 'success' || steps.update-casks.outcome == 'failure') }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [[ "$(git rev-list --count "origin/${{ github.ref_name }}..HEAD")" -eq 0 ]]; then
            echo "No update commits to push."
            exit 0
          fi
          git remote set-url origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${{ github.repository }}"
          git push origin "HEAD:${{ github.ref_name }}"
